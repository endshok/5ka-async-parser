#configuration
[API]
BASE_URL = https://5ka.ru
ORDERS_API_BASE = https://5d.5ka.ru/api
STORES_API_URL = /orders/v1/orders/stores/
PRODUCTS_API_TEMPLATE = /catalog/v2/stores/{store_id}/categories/{category_id}/products
# в начале STORES_API_URL и PRODUCTS_API_TEMPLATE должен стоять ORDERS_API_BASE
PUBLIC_API_BASE = https://api.5ka.ru/api
OFFERS_API_URL = /public/v1/promo-offers/
# в начале OFFERS_API_URL должен стоять PUBLIC_API_BASE

[USER_AGENT]
sys1 = Mozilla/5.0 (Windows NT 10.0; Win64; x64)
sys2 = AppleWebKit/537.36 (KHTML, like Gecko)
sys3 = Chrome/150.0.0.0 YaBrowser/26.8.0.0 Safari/537.36

[HEADERS]
Accept = application/json, text/plain, */*
Accept_Language = ru,en;q=0.9
Referer = https://5ka.ru/
Origin = https://5ka.ru
X_Tenant_Id = TC5
X_Capabilities = tenant=ts5;clientVersion=0.1.1;timezone=+3;OS=webapp/;teamId=5m

[PUBLIC_HEADERS]
Accept_pub = application/json, text/plain, */*
Accept_Language_pub = ru,en;q=0.9
Referer_pub = https://5ka.ru/
Origin_pub = https://5ka.ru

[LOCATION]
DEFAULT_LON = 37.6156
DEFAULT_LAT = 55.7522

[LIMITS]
CONCURRENCY_LIMIT = 8
REQUEST_TIMEOUT = 20
MAX_RETRIES = 3
RETRY_DELAY = 2

[LOGGING]
name = 5ka_parser
level = INFO
format = %(asctime)s [%(levelname)s] %(message)s

